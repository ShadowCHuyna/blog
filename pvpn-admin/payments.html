<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Платежи · PVPN панель</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" id="topbar">
  <a class="brand" href="index.html">PVPN&nbsp;·&nbsp;панель</a>
  <nav class="nav">
    <a href="index.html" data-nav="plans">Тарифы</a>
    <a href="payments.html" data-nav="payments">Платежи</a>
    <a href="order.html" data-nav="order">Заказ</a>
    <a href="grants.html" data-nav="grants">Выдачи</a>
    <a href="webhooks.html" data-nav="webhooks">Уведомления</a>
  </nav>
  <div class="topbar-right">
    <span class="operator" id="operator-info" hidden></span>
    <button type="button" class="link-button" id="logout" hidden>Выйти</button>
  </div>
</header>

<main class="content">
  <div id="flash-slot"></div>
  <div id="page">загрузка…</div>
</main>

<footer class="footer">
  PVPN admin panel · static · вызывает /api/v1/admin/** напрямую
</footer>

<script src="app.js"></script>
<script>
(function () {
    "use strict";

    var STATUSES = ["pending", "paid", "expired", "failed", "cancelled"];
    var state = { offset: 0, filters: { status: "", client_uuid: "", label: "", contact: "" } };

    function pick(id) { return document.getElementById(id); }
    function esc(value) { return PAdmin.esc(value); }

    PAdmin.boot("payments", function () {
        readQuery();
        renderList();
    });

    function readQuery() {
        var query = new URLSearchParams(location.search);
        if (query.get("status") && STATUSES.indexOf(query.get("status")) >= 0) {
            state.filters.status = query.get("status");
        }
        var direct = query.get("payment");
        if (direct) {
            // Открыть карточку платежа сразу после перехода из раздела «Заказ».
            renderDirect(direct);
        }
    }

    // ------------------------------------------------------------- список
    function readFilters() {
        state.filters = {
            status: pick("f-status").value,
            client_uuid: pick("f-client").value.trim(),
            label: pick("f-label").value.trim(),
            contact: pick("f-contact").value.trim()
        };
    }

    function renderList() {
        pick("page").innerHTML =
            '<div class="page-head"><h1>Платежи</h1></div>' +
            '<div class="filters">' +
            '<label><span>статус</span><select id="f-status">' +
            '<option value="">любой</option>' + STATUSES.map(option).join("") + "</select></label>" +
            '<label><span>client_uuid</span><input type="text" id="f-client" spellcheck="false"></label>' +
            '<label><span>label</span><input type="text" id="f-label" spellcheck="false"></label>' +
            '<label><span>контакт</span><input type="text" id="f-contact"></label>' +
            '<button type="button" id="f-apply" class="button primary">применить</button>' +
            '<button type="button" id="f-reset" class="button">сбросить</button>' +
            "</div>" +
            '<div id="list-slot"></div><div id="pager"></div>' +
            '<section id="detail" hidden></section>';

        pick("f-status").value = state.filters.status;
        pick("f-client").value = state.filters.client_uuid;
        pick("f-label").value = state.filters.label;
        pick("f-contact").value = state.filters.contact;
        pick("f-apply").addEventListener("click", function () {
            readFilters();
            state.offset = 0;
            refreshList();
        });
        pick("f-reset").addEventListener("click", function () {
            state = { offset: 0, filters: { status: "", client_uuid: "", label: "", contact: "" } };
            renderList();
        });

        refreshList();
    }

    function refreshList() {
        PAdmin.flash("");
        var filters = state.filters;
        var query = "?limit=50&offset=" + state.offset;
        if (filters.status) query += "&status=" + encodeURIComponent(filters.status);
        if (filters.client_uuid) query += "&client_uuid=" + encodeURIComponent(filters.client_uuid);
        if (filters.label) query += "&label=" + encodeURIComponent(filters.label);
        if (filters.contact) query += "&contact=" + encodeURIComponent(filters.contact);
        PAdmin.request("/api/v1/admin/payments" + query).then(function (payload) {
            renderTable(payload);
        }).catch(errorHandler());
    }

    function option(status) {
        return '<option value="' + esc(status) + '">' + esc(status) + "</option>";
    }

    function renderTable(payload) {
        var slot = pick("list-slot");
        var items = payload.items || [];
        if (items.length === 0) {
            slot.innerHTML = '<div class="empty">платежей по заданным фильтрам нет</div>';
        } else {
            var rows = items.map(function (payment) {
                return '<tr data-payment-id="' + esc(payment.payment_id) + '">' +
                    "<td><code>" + esc(PAdmin.short(payment.payment_id)) + "</code></td>" +
                    "<td>" + PAdmin.statusBadge(payment.status) + "</td>" +
                    "<td>" + esc(payment.plan_id) + "</td>" +
                    "<td>" + PAdmin.fmtMoney(payment.amount, payment.currency) + "</td>" +
                    "<td>" + esc(payment.contact.type) + ": " + esc(payment.contact.value) + "</td>" +
                    "<td>" + PAdmin.fmtDate(payment.created_at) + "</td>" +
                    "<td>" + PAdmin.fmtDate(payment.expires_at) + "</td>" +
                    "<td>" + PAdmin.fmtDate(payment.paid_at) + "</td></tr>";
            }).join("");
            slot.innerHTML =
                '<div class="table-wrap"><table><thead><tr>' +
                "<th>платёж</th><th>статус</th><th>тариф</th><th>сумма</th>" +
                "<th>контакт</th><th>создан</th><th>оплатить до</th><th>оплачен</th>" +
                "</tr></thead><tbody>" + rows + "</tbody></table></div>";
            slot.querySelectorAll("tr[data-payment-id]").forEach(function (row) {
                row.style.cursor = "pointer";
                row.addEventListener("click", function () {
                    openDetail(row.getAttribute("data-payment-id"));
                });
            });
        }
        PAdmin.renderPagination(pick("pager"), payload.pagination, function (offset) {
            state.offset = offset;
            refreshList();
        });
    }

    // -------------------------------------------------------------- деталь
    function renderDirect(paymentId) {
        renderList(); // фильтры из state уже прочитаны; detail рисуем после
        openDetail(paymentId);
    }

    function openDetail(paymentId) {
        var detail = pick("detail");
        if (!detail) return;
        detail.hidden = false;
        detail.innerHTML = '<p class="muted">загружаем платёж…</p>';
        detail.scrollIntoView({ behavior: "smooth", block: "nearest" });

        // Публичный эндпоинт-детали отдаёт инструкции, post-webhook поля и выдачу.
        PAdmin.request("/api/v1/payments/" + encodeURIComponent(paymentId)).then(function (payment) {
            renderPaymentDetail(payment);
        }).catch(function (error) {
            if (error.status === 404) {
                detail.innerHTML = '<div class="empty">платёж не найден</div>';
                return;
            }
            detail.innerHTML = "";
            throw error;
        }).catch(errorHandler());
    }

    function renderPaymentDetail(payment) {
        var detail = pick("detail");
        var instructions = payment.payment_instructions || {};
        var grant = payment.subscription_grant;
        var paymentUrl = instructions.payment_url
            ? '<a href="' + esc(instructions.payment_url) + '" target="_blank" rel="noopener noreferrer">открыть ссылку оплаты</a>'
            : "—";

        var parts = ["<h2>платёж <code>" + esc(PAdmin.short(payment.payment_id)) + "</code></h2>",
            '<div class="card">' + PAdmin.kvTable([
                ["payment_id", '<code>' + esc(payment.payment_id) + "</code>"],
                ["статус", PAdmin.statusBadge(payment.status)],
                ["label", "<code>" + esc(instructions.label) + "</code>"],
                ["тариф", esc(payment.plan_id) + " · " + esc(payment.duration_days) + " дн."],
                ["сумма", PAdmin.fmtMoney(payment.amount, payment.currency)],
                ["контакт", esc(payment.contact.type) + ": " + esc(payment.contact.value)],
                ["создан", PAdmin.fmtDate(payment.created_at)],
                ["оплатить до", PAdmin.fmtDate(payment.expires_at)],
                ["оплачен", PAdmin.fmtDate(payment.paid_at)],
                ["yoomoney operation", payment.yoomoney ? "<code>" + esc(payment.yoomoney.operation_id) + "</code>" : "—"]
            ]) + "</div>"];

        parts.push('<div class="card"><h2 style="margin-top:0">реквизиты оплаты</h2>' +
            PAdmin.kvTable([
                ["кошелёк", "<code>" + esc(instructions.wallet_id) + "</code>"],
                ["метка (обязательно)", "<code>" + esc(instructions.label) + "</code>"],
                ["ссылка оплаты", paymentUrl],
                ["инструкция", esc(instructions.manual_instructions)]
            ]) + "</div>");

        if (grant) {
            parts.push('<div class="card"><h2 style="margin-top:0">выдача подписки</h2>' +
                PAdmin.kvTable([
                    ["grant_id", "<code>" + esc(grant.grant_id) + "</code>"],
                    ["действие", esc(grant.action)],
                    ["статус", PAdmin.statusBadge(grant.status)],
                    ["попытки", esc(grant.attempts)],
                    ["цель expire_at", PAdmin.fmtDate(grant.target_expire_at)],
                    ["выполнено", PAdmin.fmtDate(grant.succeeded_at)],
                    ["ошибка", esc(grant.last_error_code || "") + (grant.last_error_message ? " · " + esc(grant.last_error_message) : "")]
                ]) +
                (grant.result ? PAdmin.detailsJson("результат выдачи", grant.result) : "") +
                "</div>");
        }

        parts.push('<div class="form-actions">' +
            '<button type="button" id="btn-reconcile" class="button primary">сверить с ЮMoney</button>' +
            (payment.status === "pending"
                ? '<button type="button" id="btn-cancel" class="button danger">отменить заказ</button>'
                : "") +
            '<button type="button" id="btn-close" class="button">закрыть</button></div>');

        detail.innerHTML = parts.join("");

        pick("btn-close").addEventListener("click", closeDetail);
        pick("btn-reconcile").addEventListener("click", function () { reconcile(payment.payment_id); });
        var cancel = pick("btn-cancel");
        if (cancel) {
            cancel.addEventListener("click", function () {
                if (!window.confirm("Отменить заказ? Отменить можно только незавершённый платёж.")) return;
                PAdmin.request(
                    "/api/v1/payments/" + encodeURIComponent(payment.payment_id) + "/cancel",
                    { method: "POST" }
                ).then(function (payload) {
                    PAdmin.flash("Заказ отменён", "success");
                    openDetail(payload.payment_id);
                }).catch(errorHandler());
            });
        }
    }

    function reconcile(paymentId) {
        PAdmin.request(
            "/api/v1/admin/payments/" + encodeURIComponent(paymentId) + "/reconcile",
            { method: "POST", body: { force: false } }
        ).then(function (result) {
            var action = result.matched ? "операция найдена" : "операция не найдена";
            PAdmin.flash(
                "Сверка выполнена: " + result.previous_status + " → " + result.status +
                " (" + action + ")" + (result.reason ? " · " + result.reason : ""),
                result.status === "paid" ? "success" : "info"
            );
            openDetail(paymentId);
        }).catch(function (error) {
            PAdmin.flash("Сверка не выполнена: " + error.message + (error.status ? " (HTTP " + error.status + ")" : ""), "error");
            openDetail(paymentId);
        });
    }

    function closeDetail() {
        var detail = pick("detail");
        if (detail) {
            detail.hidden = true;
            detail.innerHTML = "";
        }
    }

    function errorHandler() {
        return function (error) {
            if (error.status === undefined) {
                PAdmin.flash("Не удалось связаться с API: " + (error.message || "нет соединения"), "error");
                return;
            }
            PAdmin.flash(error.message + (error.status ? " (HTTP " + error.status + ")" : ""), "error");
        };
    }
})();
</script>
</body>
</html>
