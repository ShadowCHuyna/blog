# Настройки страницы покупки pVPN.
#
# Здесь только то, что меняется вместе с продуктом. Ключи и адреса
# живых систем в репозитории не хранятся.

# Адрес платёжного сервиса. Он же и есть origin для CORS.
api_base: "https://api.potatom.net"

# Бот, которому привязывается Telegram.
bot_username: "potatom_vpn_bot"
bot_url: "https://t.me/potatom_vpn_bot"

# Тот же домен, что и у сайта: Login Widget требует, чтобы он был
# прописан в BotFather через /setdomain.
site_origin: "https://potatom.net"

plan:
  id: "pvpn_1m"
  name: "1 месяц"
  amount: "250"
  currency: "₽"
  days: 30
  hwid_device_limit: 5
  traffic: "безлимит"

# Что показываем до покупки.
features:
  - title: "WireGuard"
    meta: "протокол"
    text: "Современный и быстрый: работает там, где другие VPN уже сдались."
  - title: "5 устройств"
    meta: "одновременно"
    text: "Телефон, ноутбук и ещё три. Переключайтесь между ними свободно."
  - title: "Безлимит"
    meta: "трафик"
    text: "Никаких гигабайт и счётчиков. Столько, сколько нужно."
  - title: "Без рекламы"
    meta: "логи"
    text: "Мы не продаём и не смотрим ваш трафик. Логи не храним."
