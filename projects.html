---
layout: default
permalink: /projects/
---
<h1>Проекты.</h1>

<p class="lead">
    Некоторые проекты, которые мы
    разработали, поддерживаем или
    продолжаем развивать.
</p>


<section class="section">
    <h2 class="comment">что мы сделали<span class="tag">[01/01]</span></h2>

    <div class="list">

        {% for project in site.projects %}

        <a href="{{ project.url | relative_url }}" class="list-item">

            <span class="number">{{ project.number }}</span>

            <span>
                <strong>{{ project.title }}</strong>
                <br>
                <span class="meta">
                    {{ project.tags | join: ' / ' }}
                </span>
            </span>

            <span class="arrow">→</span>

        </a>

        {% endfor %}

    </div>
</section>
